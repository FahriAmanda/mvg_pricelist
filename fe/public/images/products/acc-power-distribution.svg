<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#020617"/>
  <!-- Rackmount Panel Distribution Enclosure -->
  <rect x="80" y="120" width="340" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- 3 Phase Voltage Indicators (R, S, T) -->
  <circle cx="140" cy="165" r="14" fill="#ef4444"/>
  <circle cx="180" cy="165" r="14" fill="#eab308"/>
  <circle cx="220" cy="165" r="14" fill="#3b82f6"/>
  <!-- Digital Voltmeter -->
  <rect x="270" y="150" width="110" height="32" rx="4" fill="#090d16"/>
  <text x="325" y="172" fill="#ef4444" font-family="monospace" font-weight="bold" font-size="15" text-anchor="middle">380 V</text>
  <!-- MCB Breakers Row -->
  <g fill="#090d16" stroke="#64748b" stroke-width="1">
    <rect x="120" y="220" width="25" height="50" rx="2"/>
    <rect x="155" y="220" width="25" height="50" rx="2"/>
    <rect x="190" y="220" width="25" height="50" rx="2"/>
    <rect x="225" y="220" width="25" height="50" rx="2"/>
    <rect x="260" y="220" width="25" height="50" rx="2"/>
    <rect x="295" y="220" width="25" height="50" rx="2"/>
    <rect x="330" y="220" width="25" height="50" rx="2"/>
  </g>
  <text x="250" y="420" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">POWER DISTRIBUTION 3-PHASE</text>
  <text x="250" y="445" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">6 Port / 12 Port / 18 Port 16A MCB</text>
</svg>