<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
  </defs>
  <rect width="500" height="500" rx="28" fill="url(#bg)"/>
  <!-- Cabinet Frame (1000x500 Curve) -->
  <rect x="70" y="60" width="360" height="380" rx="12" fill="url(#frame)" stroke="#475569" stroke-width="4"/>
  <!-- Corner Protectors -->
  <polygon points="70,60 110,60 70,100" fill="#f59e0b"/>
  <polygon points="430,60 390,60 430,100" fill="#f59e0b"/>
  <polygon points="70,440 110,440 70,400" fill="#f59e0b"/>
  <polygon points="430,440 390,440 430,400" fill="#f59e0b"/>
  <!-- LED Matrix Grid -->
  <g opacity="0.85">
    <rect x="85" y="75" width="160" height="170" rx="6" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <rect x="255" y="75" width="160" height="170" rx="6" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <rect x="85" y="255" width="160" height="170" rx="6" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <rect x="255" y="255" width="160" height="170" rx="6" fill="#020617" stroke="#1e293b" stroke-width="2"/>
    <!-- LED dots pattern simulation -->
    <circle cx="165" cy="160" r="40" fill="url(#gold)" filter="url(#glow)" opacity="0.3"/>
    <circle cx="335" cy="160" r="40" fill="url(#gold)" filter="url(#glow)" opacity="0.3"/>
    <circle cx="165" cy="340" r="40" fill="url(#gold)" filter="url(#glow)" opacity="0.3"/>
    <circle cx="335" cy="340" r="40" fill="url(#gold)" filter="url(#glow)" opacity="0.3"/>
  </g>
  <!-- Fast Quick Lock Handles -->
  <rect x="230" y="42" width="40" height="18" rx="4" fill="#f59e0b"/>
  <rect x="42" y="230" width="18" height="40" rx="4" fill="#f59e0b"/>
  <rect x="440" y="230" width="18" height="40" rx="4" fill="#f59e0b"/>
  <!-- Central Badge -->
  <rect x="150" y="228" width="200" height="44" rx="8" fill="#090d16" stroke="#f59e0b" stroke-width="2"/>
  <text x="250" y="248" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">FABULUX MASTER PLUS</text>
  <text x="250" y="263" fill="#f59e0b" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">P3.9 OUTDOOR RENTAL</text>
</svg>