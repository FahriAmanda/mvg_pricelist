<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#090d16"/>
  <!-- Tall LED Poster Aspect 640x1920 -->
  <rect x="170" y="50" width="160" height="350" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="4"/>
  <!-- Screen Graphic -->
  <rect x="180" y="60" width="140" height="310" rx="6" fill="#0f172a"/>
  <!-- Mobile Wheels / Base Stand -->
  <rect x="140" y="400" width="220" height="20" rx="6" fill="#334155"/>
  <circle cx="160" cy="430" r="10" fill="#64748b"/>
  <circle cx="340" cy="430" r="10" fill="#64748b"/>
  <text x="250" y="200" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">LED POSTER</text>
  <text x="250" y="225" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle">640 x 1920 mm</text>
  <text x="250" y="250" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Flat &amp; Foldable</text>
</svg>