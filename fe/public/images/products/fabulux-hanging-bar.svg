<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#0f172a"/>
  <!-- Rigging Beam 100cm / 50cm -->
  <rect x="40" y="190" width="420" height="70" rx="8" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <!-- Quick release pins & Eyebolts -->
  <circle cx="80" cy="160" r="14" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <line x1="80" y1="174" x2="80" y2="190" stroke="#f59e0b" stroke-width="6"/>
  <circle cx="420" cy="160" r="14" fill="none" stroke="#f59e0b" stroke-width="6"/>
  <line x1="420" y1="174" x2="420" y2="190" stroke="#f59e0b" stroke-width="6"/>
  <!-- Locks on bottom -->
  <rect x="110" y="260" width="25" height="40" rx="4" fill="#f59e0b"/>
  <rect x="235" y="260" width="30" height="40" rx="4" fill="#f59e0b"/>
  <rect x="365" y="260" width="25" height="40" rx="4" fill="#f59e0b"/>
  <text x="250" y="232" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">2 IN 1 HANGING + BASE BAR</text>
  <text x="250" y="360" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="13" text-anchor="middle">Universal Rigging & Ground Support (50cm / 100cm)</text>
