<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/></linearGradient>
  </defs>
  <rect width="500" height="500" rx="28" fill="#090d16"/>
  <!-- Moving Head Base -->
  <rect x="130" y="360" width="240" height="80" rx="14" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <rect x="170" y="380" width="160" height="35" rx="6" fill="#020617"/>
  <text x="250" y="403" fill="#38bdf8" font-family="monospace" font-size="13" text-anchor="middle">MEANREAL BSW 550</text>
  <!-- Moving Head Yoke Arms -->
  <path d="M 160,360 L 160,220 L 200,220 L 200,360 Z" fill="#334155"/>
  <path d="M 340,360 L 340,220 L 300,220 L 300,360 Z" fill="#334155"/>
