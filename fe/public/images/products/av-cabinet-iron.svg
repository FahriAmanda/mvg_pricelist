  <rect x="75" y="75" width="350" height="350" rx="10" fill="#131720" stroke="#475569" stroke-width="5"/>
  <!-- Ventilation Fans / Grill -->
  <circle cx="170" cy="180" r="50" fill="#1e293b" stroke="#334155" stroke-width="3"/>
