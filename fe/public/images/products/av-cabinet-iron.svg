  <rect x="85" y="85" width="25" height="15" rx="3" fill="#64748b"/>
  <rect x="390" y="85" width="25" height="15" rx="3" fill="#64748b"/>
  <rect x="85" y="400" width="25" height="15" rx="3" fill="#64748b"/>
