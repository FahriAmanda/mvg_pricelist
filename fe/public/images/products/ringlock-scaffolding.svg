<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#090d16"/>
  <!-- Scaffolding Uprights & Rosettes -->
  <rect x="120" y="60" width="18" height="340" fill="#94a3b8"/>
  <rect x="360" y="60" width="18" height="340" fill="#94a3b8"/>
  <!-- Rosette Rings (8-hole) -->
  <circle cx="129" cy="150" r="22" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
  <circle cx="369" cy="150" r="22" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
  <circle cx="129" cy="300" r="22" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
  <circle cx="369" cy="300" r="22" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
  <!-- Horizontal Ledger -->
  <rect x="138" y="142" width="222" height="16" fill="#cbd5e1"/>
  <rect x="138" y="292" width="222" height="16" fill="#cbd5e1"/>
  <!-- Diagonal Brace -->
  <line x1="129" y1="300" x2="369" y2="150" stroke="#cbd5e1" stroke-width="12"/>
  <!-- Jack Base on Bottom -->
  <rect x="90" y="400" width="78" height="14" fill="#f59e0b"/>
  <rect x="330" y="400" width="78" height="14" fill="#f59e0b"/>
  <text x="250" y="455" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">RINGLOCK SCAFFOLDING Q335</text>
</svg>