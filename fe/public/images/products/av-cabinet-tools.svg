<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#090d16"/>
  <!-- Vacuum Cup Tool -->
  <rect x="225" y="80" width="50" height="150" rx="10" fill="#334155" stroke="#64748b" stroke-width="3"/>
