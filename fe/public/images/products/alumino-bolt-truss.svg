<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#0f172a"/>
  <!-- 4 Main Tubes -->
  <rect x="60" y="130" width="380" height="18" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="60" y="320" width="380" height="18" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Diagonal Braces -->
  <g stroke="#cbd5e1" stroke-width="10" stroke-linecap="round">
    <line x1="80" y1="140" x2="160" y2="330"/>
    <line x1="160" y1="330" x2="240" y2="140"/>
    <line x1="240" y1="140" x2="320" y2="330"/>
    <line x1="320" y1="330" x2="400" y2="140"/>
  </g>
  <!-- Bolt Flange Plates -->
  <rect x="50" y="110" width="16" height="250" rx="4" fill="#e2e8f0"/>
  <rect x="434" y="110" width="16" height="250" rx="4" fill="#e2e8f0"/>
  <text x="250" y="420" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">ALUMINO BOLT TRUSS 6082-T6</text>
  <text x="250" y="445" fill="#94a3b8" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">300x300 / 400x400 / 450x450 / 600x760</text>
</svg>