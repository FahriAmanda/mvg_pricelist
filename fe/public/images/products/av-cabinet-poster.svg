<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#090d16"/>
  <!-- Tall Poster Cabinet Stand -->
  <rect x="175" y="60" width="150" height="320" rx="8" fill="#18181b" stroke="#0ea5e9" stroke-width="4"/>
  <!-- Inner frame -->
  <rect x="185" y="70" width="130" height="300" rx="4" fill="#09090b"/>
  <!-- Base with wheels -->
  <rect x="145" y="380" width="210" height="24" rx="6" fill="#334155"/>
  <circle cx="170" cy="420" r="10" fill="#64748b"/>
  <circle cx="330" cy="420" r="10" fill="#64748b"/>
  <!-- Label -->
  <text x="250" y="210" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="15" text-anchor="middle">POSTER CABINET</text>
  <text x="250" y="235" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">Flat &amp; Foldable Base</text>
</svg>