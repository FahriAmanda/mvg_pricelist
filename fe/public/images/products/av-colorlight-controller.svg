<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="28" fill="#0f172a"/>
  <!-- Colorlight Receiving Card PCB View -->
  <rect x="90" y="110" width="320" height="240" rx="10" fill="#065f46" stroke="#10b981" stroke-width="3"/>
  <!-- HUB75 Connectors Grid -->
  <g fill="#022c22" stroke="#34d399" stroke-width="1.5">
    <rect x="110" y="130" width="35" height="15" rx="2"/>
    <rect x="110" y="160" width="35" height="15" rx="2"/>
    <rect x="110" y="190" width="35" height="15" rx="2"/>
    <rect x="110" y="220" width="35" height="15" rx="2"/>
    <rect x="110" y="250" width="35" height="15" rx="2"/>
    <rect x="110" y="280" width="35" height="15" rx="2"/>
    <rect x="355" y="130" width="35" height="15" rx="2"/>
    <rect x="355" y="160" width="35" height="15" rx="2"/>
    <rect x="355" y="190" width="35" height="15" rx="2"/>
    <rect x="355" y="220" width="35" height="15" rx="2"/>
    <rect x="355" y="250" width="35" height="15" rx="2"/>
    <rect x="355" y="280" width="35" height="15" rx="2"/>
  </g>
  <!-- FPGA Chip -->
  <rect x="200" y="180" width="100" height="100" rx="6" fill="#020617" stroke="#10b981" stroke-width="2"/>
  <text x="250" y="235" fill="#34d399" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">COLORLIGHT</text>
  <text x="250" y="410" fill="#f8fafc" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle">COLORLIGHT RECEIVING CARD</text>
  <text x="250" y="435" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">5A-75B / 5A-75E / i5 / E80 Series</text>
</svg>