name: Deploy MVG Pricelist to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pricelist-vps
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml

      - name: Install dependencies (FE)
        run: |
          cd fe
          pnpm install --frozen-lockfile

      - name: Build Nuxt Application
        run: |
          cd fe
          pnpm run build

      - name: Configure SSH and Deploy to VPS
        timeout-minutes: 5
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s" << 'EOF'
            set -Eeuo pipefail

            APP_DIR="/home/hisekawa/mvg/mvg_pricelist"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository..."
              mkdir -p /home/hisekawa/mvg
              git clone https://github.com/FahriAmanda/mvg_pricelist.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            cd fe
            echo "Installing dependencies..."
            pnpm install

            echo "Building application..."
            pnpm run build

            echo "Managing PM2 process..."
            if pm2 describe mvg-pricelist > /dev/null 2>&1; then
              echo "Reloading existing mvg-pricelist PM2 process..."
              pm2 reload mvg-pricelist --update-env
            else
              echo "Starting new mvg-pricelist PM2 process on port 18200..."
              PORT=18200 pm2 start .output/server/index.mjs --name mvg-pricelist
            fi
            pm2 save

            echo "Verifying application readiness..."
            sleep 3
            curl -s -f http://127.0.0.1:18200/ > /dev/null
            echo "Deployment verified successfully!"
          EOF
